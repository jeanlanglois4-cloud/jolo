<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Jeu HTML - Space Dodge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151d33;
      --accent: #53d8fb;
      --danger: #ff6b6b;
      --text: #e7ecff;
      --muted: #95a0c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #18254a, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 1rem;
    }
    .game-shell {
      width: min(920px, 100%);
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }
    .hud {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid #2a365f;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .hud strong { color: var(--accent); }
    .controls { color: var(--muted); font-size: .95rem; }
    canvas {
      width: 100%;
      max-width: 920px;
      height: auto;
      border-radius: 14px;
      border: 1px solid #2a365f;
      background: linear-gradient(180deg, #101a35, #090f21);
      box-shadow: 0 12px 24px rgba(0,0,0,.35);
    }
    .btn {
      border: 1px solid #2a365f;
      background: #1e2a4d;
      color: var(--text);
      padding: .55rem .9rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #243462; }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="hud">
      <div>Score: <strong id="score">0</strong></div>
      <div>Meilleur score: <strong id="best">0</strong></div>
      <button id="restart" class="btn">Recommencer</button>
      <div class="controls">Déplacements: ← → (ou A/D). Pause: Espace.</div>
    </section>
    <canvas id="game" width="920" height="520" aria-label="Zone de jeu"></canvas>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const restartBtn = document.getElementById('restart');

    const state = {
      width: canvas.width,
      height: canvas.height,
      player: { x: 460, y: 470, w: 44, h: 26, speed: 420 },
      bullets: [],
      asteroids: [],
      stars: [],
      keys: new Set(),
      score: 0,
      best: Number(localStorage.getItem('spaceDodgeBest') || 0),
      spawnTimer: 0,
      spawnEvery: 0.55,
      bulletTimer: 0,
      bulletEvery: 0.18,
      gameOver: false,
      paused: false,
      elapsed: 0,
    };

    bestEl.textContent = state.best;

    for (let i = 0; i < 120; i++) {
      state.stars.push({
        x: Math.random() * state.width,
        y: Math.random() * state.height,
        r: Math.random() * 1.8 + 0.4,
        s: Math.random() * 26 + 10,
      });
    }

    function resetGame() {
      state.player.x = state.width / 2 - state.player.w / 2;
      state.bullets = [];
      state.asteroids = [];
      state.score = 0;
      state.spawnTimer = 0;
      state.spawnEvery = 0.55;
      state.bulletTimer = 0;
      state.gameOver = false;
      state.paused = false;
      state.elapsed = 0;
      scoreEl.textContent = '0';
    }

    function rectsCollide(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function spawnAsteroid() {
      const size = 24 + Math.random() * 34;
      const speed = 130 + Math.random() * 120 + state.elapsed * 4;
      state.asteroids.push({
        x: Math.random() * (state.width - size),
        y: -size,
        w: size,
        h: size,
        speed,
      });
    }

    function fireBullet() {
      state.bullets.push({
        x: state.player.x + state.player.w / 2 - 3,
        y: state.player.y - 10,
        w: 6,
        h: 12,
        speed: 560,
      });
    }

    function update(dt) {
      if (state.paused || state.gameOver) return;
      state.elapsed += dt;

      if (state.keys.has('ArrowLeft') || state.keys.has('KeyA')) state.player.x -= state.player.speed * dt;
      if (state.keys.has('ArrowRight') || state.keys.has('KeyD')) state.player.x += state.player.speed * dt;
      state.player.x = Math.max(0, Math.min(state.width - state.player.w, state.player.x));

      state.spawnTimer += dt;
      if (state.spawnTimer >= state.spawnEvery) {
        spawnAsteroid();
        state.spawnTimer = 0;
        state.spawnEvery = Math.max(0.2, state.spawnEvery - 0.002);
      }

      state.bulletTimer += dt;
      if (state.bulletTimer >= state.bulletEvery) {
        fireBullet();
        state.bulletTimer = 0;
      }

      for (const star of state.stars) {
        star.y += star.s * dt;
        if (star.y > state.height) {
          star.y = -4;
          star.x = Math.random() * state.width;
        }
      }

      for (const b of state.bullets) b.y -= b.speed * dt;
      for (const a of state.asteroids) a.y += a.speed * dt;

      // collisions bullet vs asteroid
      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        for (let j = state.asteroids.length - 1; j >= 0; j--) {
          const a = state.asteroids[j];
          if (rectsCollide(b, a)) {
            state.bullets.splice(i, 1);
            state.asteroids.splice(j, 1);
            state.score += 10;
            scoreEl.textContent = String(state.score);
            break;
          }
        }
      }

      // collision player vs asteroid or asteroid escapes
      for (let i = state.asteroids.length - 1; i >= 0; i--) {
        const a = state.asteroids[i];
        if (rectsCollide(state.player, a) || a.y > state.height + a.h) {
          state.gameOver = true;
          state.best = Math.max(state.best, state.score);
          localStorage.setItem('spaceDodgeBest', String(state.best));
          bestEl.textContent = String(state.best);
        }
      }

      state.bullets = state.bullets.filter(b => b.y + b.h > 0);
      state.asteroids = state.asteroids.filter(a => a.y < state.height + a.h * 2);
    }

    function drawShip(x, y, w, h) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#67e0ff';
      ctx.beginPath();
      ctx.moveTo(w / 2, 0);
      ctx.lineTo(w, h);
      ctx.lineTo(w * 0.65, h * 0.8);
      ctx.lineTo(w * 0.35, h * 0.8);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#dff8ff';
      ctx.fillRect(w * 0.43, h * 0.34, w * 0.14, h * 0.26);
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, state.width, state.height);

      for (const star of state.stars) {
        ctx.fillStyle = '#93b6ff';
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawShip(state.player.x, state.player.y, state.player.w, state.player.h);

      ctx.fillStyle = '#ffe27a';
      for (const b of state.bullets) ctx.fillRect(b.x, b.y, b.w, b.h);

      for (const a of state.asteroids) {
        ctx.fillStyle = '#a6a9c8';
        ctx.beginPath();
        ctx.arc(a.x + a.w / 2, a.y + a.h / 2, a.w / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#7e84ac';
        ctx.beginPath();
        ctx.arc(a.x + a.w * 0.35, a.y + a.h * 0.35, a.w * 0.14, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.paused && !state.gameOver) {
        overlay('PAUSE', 'Appuie sur Espace pour reprendre');
      }

      if (state.gameOver) {
        overlay('GAME OVER', 'Appuie sur Recommencer');
      }
    }

    function overlay(title, subtitle) {
      ctx.fillStyle = 'rgba(3, 7, 16, 0.68)';
      ctx.fillRect(0, 0, state.width, state.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '700 56px system-ui';
      ctx.fillText(title, state.width / 2, state.height / 2 - 22);
      ctx.font = '500 24px system-ui';
      ctx.fillStyle = '#c7d2ff';
      ctx.fillText(subtitle, state.width / 2, state.height / 2 + 30);
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!state.gameOver) state.paused = !state.paused;
      }
      state.keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => state.keys.delete(e.code));

    restartBtn.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
